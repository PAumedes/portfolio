services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: ${APP_NAME:-portfolio}_app
    ports:
      - "8000:8000"
    networks:
      - portfolio_network
    depends_on:
      - db
      - redis
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          cpus: '1'
          memory: 768M

  web:
    build:
      context: ./docker/web
    container_name: ${APP_NAME:-portfolio}_web
    ports:
      - "8080:80"
    networks:
      - portfolio_network
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://app:8000/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  db:
    image: mysql:8.0
    container_name: ${APP_NAME:-portfolio}_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - portfolio_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 384M

  redis:
    build:
      context: ./docker/redis
    container_name: ${APP_NAME:-portfolio}_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - portfolio_network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  portfolio_network:
    driver: bridge

volumes:
  db_data:
