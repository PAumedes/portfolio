version: '3.8'

services:
  app:
    container_name: ${APP_NAME:-portfolio}_app
    ports:
      - "8000:8000"
    networks:
      - portfolio_network
    depends_on:
      - db
      - redis
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./docker/web
    container_name: ${APP_NAME:-portfolio}_web
    networks:
      - portfolio_network
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.0
    container_name: ${APP_NAME:-portfolio}_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - portfolio_network
    security_opt:
      - no-new-privileges:true

  redis:
    build:
      context: ./docker/redis
    container_name: ${APP_NAME:-portfolio}_redis
    networks:
      - portfolio_network
    security_opt:
      - no-new-privileges:true

networks:
  portfolio_network:
    driver: bridge

volumes:
  db_data:
