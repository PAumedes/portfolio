services:
  app:
    build:
      target: development
    volumes:
      - .:/var/www/html
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - APP_DEBUG=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    volumes:
      - .:/var/www/html

  db:
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  node:
    build:
      context: ./docker/node
    container_name: ${APP_NAME:-portfolio}_node
    volumes:
      - .:/var/www/html
    command: npm run dev
    tty: true
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - portfolio_network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
